# Gera o executável do Mega Drive Audio Converter no GitHub (Windows), sem precisar do seu PC.
# - Manual: aba Actions → "Executável Windows" → Run workflow. O zip fica em "Artifacts".
# - Com tag (ex.: v0.2): além disso, cria o Release com o zip anexado.
name: Executável Windows

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # roda em Windows 8.1, 10 e 11 (64 bits)

      - name: Dependências
        run: python -m pip install --upgrade pip numpy scipy PySide6 pyinstaller pytest

      - name: Testes
        continue-on-error: true
        run: python -m pytest -q -m "not slow"

      - name: Executável
        shell: cmd
        run: >
          python -m PyInstaller --noconfirm --clean --windowed --onedir
          --name MegaDriveAudioConverter
          --add-data "mdconv\chips\native\mdchips.dll;mdconv\chips\native"
          --add-data "mdconv\chips\native\nuked_opn2\nuked_opn2.dll;mdconv\chips\native\nuked_opn2"
          --add-data "mdconv\chips\native\nuked_opn2\ym3438.c;mdconv\chips\native\nuked_opn2"
          --add-data "mdconv\chips\native\nuked_opn2\ym3438.h;mdconv\chips\native\nuked_opn2"
          --add-data "mdconv\chips\native\nuked_opn2\nuked_wrap.c;mdconv\chips\native\nuked_opn2"
          --add-data "mdconv\chips\native\nuked_opn2\LICENSE;mdconv\chips\native\nuked_opn2"
          --add-data "mdconv\chips\native\nuked_opn2\README.txt;mdconv\chips\native\nuked_opn2"
          --collect-submodules mdconv
          run_gui.py

      - name: Manual e licenças junto do programa
        shell: pwsh
        run: |
          if (Test-Path Manual_Mega_Drive_Audio_Converter.pdf) { Copy-Item Manual_Mega_Drive_Audio_Converter.pdf dist\MegaDriveAudioConverter\ }
          if (Test-Path LICENSE) { Copy-Item LICENSE dist\MegaDriveAudioConverter\ }
          if (Test-Path dist\MegaDriveAudioConverter\_internal\python312.dll) { "python312.dll ok" } else { throw "python312.dll ausente no pacote" }
          Compress-Archive -Path dist\MegaDriveAudioConverter -DestinationPath dist\MegaDriveAudioConverter-windows-x64.zip

      - name: Teste rápido do executável (abre e confere as DLLs)
        continue-on-error: true
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          $p = Start-Process -FilePath dist\MegaDriveAudioConverter\MegaDriveAudioConverter.exe -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "o executável fechou sozinho (código $($p.ExitCode))" }
          Stop-Process -Id $p.Id -Force
          "abriu e ficou rodando"

      - uses: actions/upload-artifact@v4
        with:
          name: MegaDriveAudioConverter-windows-x64
          path: dist/MegaDriveAudioConverter-windows-x64.zip

      - name: Release (só quando houver tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MegaDriveAudioConverter-windows-x64.zip
          body: |
            Extraia o zip e rode **MegaDriveAudioConverter.exe** de dentro da pasta extraída
            (ao lado da pasta `_internal`). Requer Windows 8.1, 10 ou 11 de 64 bits.
