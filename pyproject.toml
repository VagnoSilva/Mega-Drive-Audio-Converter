[project]
name = "mdconv"
version = "0.11.3"
description = "Conversor de músicas (MIDI + SF2 de GBA e de arcades Capcom CPS1) para Mega Drive (YM2612/SN76489, XGM/VGM/Furnace)"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy"]

[project.optional-dependencies]
test = ["pytest"]
gui = ["PySide6>=6.5"]

[project.scripts]
mdconv = "mdconv.cli:main"

[project.gui-scripts]
mdconv-gui = "mdconv.gui.main_window:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: testes demorados (otimizador)"]
